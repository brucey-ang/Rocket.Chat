version: '3.8'

services:
  rocketchat:
    image: rocketchat/rocket.chat:latest
    restart: always
    environment:
      MONGO_URL: "mongodb://mongodb:27017/rocketchat?replicaSet=rs0"
      MONGO_OPLOG_URL: "mongodb://mongodb:27017/local?replicaSet=rs0"
      ROOT_URL: "http://localhost:3000"
      PORT: 3000
      TRANSPORTER: "monolith"
      MOLECULER_LOG_LEVEL: "warn"
      NODE_OPTIONS: "--max-old-space-size=1024"
      OVERWRITE_SETTING_Show_Setup_Wizard: "completed"
      # 强制启用自注册功能
      ACCOUNTS_DEFAULT_USER_REGISTRATION: "true"
      ACCOUNTS_REGISTRATION_FORM: "public"
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits for low memory environments
    mem_limit: 1024m
    mem_reservation: 512m
    # CPU limits
    cpus: 0.5

  mongodb:
    image: mongo:6.0
    restart: always
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: [--replSet, rs0, --oplogSize, "128", --wiredTigerCacheSizeGB, "0.25"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Resource limits for low memory environments
    mem_limit: 512m
    mem_reservation: 256m
    # CPU limits
    cpus: 0.3

volumes:
  mongodb_data:
    driver: local
